# ============================================================
# HealthGuard AI — Core Schema
# ------------------------------------------------------------
# SINGLE SOURCE OF TRUTH. Consumed by:
#   - src/data/clean.py       (column names, valid ranges)
#   - src/api/main.py         (Pydantic request validation)
#   - frontend/src/lib/schema.json  (form generation)
#
# FROZEN as of Review 1. Any change here ripples through the
# cleaners, the trained models, the API contract and the form.
# Change it only with the whole team present.
# ============================================================

version: "1.0.0"
frozen_on: "review-1"

# ------------------------------------------------------------
# CORE FIELDS
# Present (or derivable) in ALL FOUR source datasets.
# Every model can be trained on these alone -> "core-only" variant.
# The user must supply these.
# ------------------------------------------------------------
core:
  - name: age
    label: "Age"
    type: number
    unit: "years"
    min: 18
    max: 100
    default: 45
    step: 1
    help: "Age in completed years."

  - name: sex
    label: "Sex"
    type: category
    options: ["female", "male"]
    default: "female"
    help: "Biological sex as recorded in the source datasets. Used by the model-scope check."

  - name: systolic_bp
    label: "Systolic blood pressure"
    type: number
    unit: "mmHg"
    min: 80
    max: 220
    default: 120
    step: 1
    help: "The upper number in a blood pressure reading."

  - name: bmi
    label: "Body mass index"
    type: number
    unit: "kg/m²"
    min: 12
    max: 60
    default: 24.0
    step: 0.1
    help: "Weight in kg divided by height in metres squared."

  - name: glucose
    label: "Blood glucose"
    type: number
    unit: "mg/dL"
    min: 50
    max: 350
    default: 95
    step: 1
    help: "Fasting or average plasma glucose."

  - name: smoking
    label: "Smoking status"
    type: category
    options: ["never", "former", "current"]
    default: "never"
    help: "Current or past tobacco use."

# ------------------------------------------------------------
# DISEASE-SPECIFIC EXTENSIONS
# Optional. Each one filled improves that disease's model from
# the "core-only" variant toward the "full-feature" variant.
# ------------------------------------------------------------
extensions:

  heart:
    display_name: "Heart Disease"
    fields:
      - name: cholesterol_total
        label: "Total cholesterol"
        type: number
        unit: "mg/dL"
        min: 100
        max: 600
        default: 200
        step: 1
      - name: chest_pain_type
        label: "Chest pain type"
        type: category
        options: ["typical_angina", "atypical_angina", "non_anginal", "asymptomatic"]
        default: "asymptomatic"
      - name: max_heart_rate
        label: "Maximum heart rate achieved"
        type: number
        unit: "bpm"
        min: 60
        max: 220
        default: 150
        step: 1
      - name: exercise_angina
        label: "Exercise-induced angina"
        type: category
        options: ["no", "yes"]
        default: "no"
      - name: st_depression
        label: "ST depression (oldpeak)"
        type: number
        unit: "mm"
        min: 0.0
        max: 7.0
        default: 0.8
        step: 0.1
      - name: resting_ecg
        label: "Resting ECG result"
        type: category
        options: ["normal", "st_t_abnormality", "lv_hypertrophy"]
        default: "normal"

  diabetes:
    display_name: "Diabetes"
    fields:
      - name: pregnancies
        label: "Number of pregnancies"
        type: number
        unit: "count"
        min: 0
        max: 20
        default: 0
        step: 1
        applies_when: {sex: "female"}
      - name: insulin
        label: "2-hour serum insulin"
        type: number
        unit: "mu U/mL"
        min: 0
        max: 900
        default: 80
        step: 1
      - name: skin_thickness
        label: "Triceps skinfold thickness"
        type: number
        unit: "mm"
        min: 5
        max: 100
        default: 23
        step: 1
      - name: diabetes_pedigree
        label: "Diabetes pedigree function"
        type: number
        unit: "score"
        min: 0.05
        max: 2.5
        default: 0.37
        step: 0.01
        help: "A score summarising diabetes history in relatives."

  kidney:
    display_name: "Chronic Kidney Disease"
    fields:
      - name: serum_creatinine
        label: "Serum creatinine"
        type: number
        unit: "mg/dL"
        min: 0.4
        max: 15.0
        default: 1.0
        step: 0.1
      - name: blood_urea
        label: "Blood urea"
        type: number
        unit: "mg/dL"
        min: 5
        max: 250
        default: 30
        step: 1
      - name: hemoglobin
        label: "Haemoglobin"
        type: number
        unit: "g/dL"
        min: 4.0
        max: 18.0
        default: 13.5
        step: 0.1
      - name: albumin
        label: "Urine albumin"
        type: category
        options: ["0", "1", "2", "3", "4", "5"]
        default: "0"
        help: "Dipstick albumin grade, 0 = none detected."
      - name: specific_gravity
        label: "Urine specific gravity"
        type: category
        options: ["1.005", "1.010", "1.015", "1.020", "1.025"]
        default: "1.020"

  stroke:
    display_name: "Stroke"
    fields:
      - name: hypertension
        label: "Diagnosed hypertension"
        type: category
        options: ["no", "yes"]
        default: "no"
      - name: heart_disease
        label: "Existing heart disease"
        type: category
        options: ["no", "yes"]
        default: "no"
      - name: ever_married
        label: "Ever married"
        type: category
        options: ["no", "yes"]
        default: "yes"
      - name: work_type
        label: "Work type"
        type: category
        options: ["private", "self_employed", "govt_job", "children", "never_worked"]
        default: "private"
      - name: residence_type
        label: "Residence"
        type: category
        options: ["urban", "rural"]
        default: "urban"

# ------------------------------------------------------------
# MODEL SCOPE WARNINGS
# Dataset limitations surfaced in the UI as safety guardrails
# rather than hidden in a report footnote. (Differentiator #5.)
# ------------------------------------------------------------
scope_warnings:
  - disease: diabetes
    condition: {field: sex, equals: "male"}
    severity: high
    message: >
      The diabetes model was trained on the Pima Indian Diabetes dataset,
      which contains female patients only. This prediction is an
      extrapolation outside the training population and should be treated
      with caution.

  - disease: diabetes
    condition: {field: age, less_than: 21}
    severity: medium
    message: >
      The diabetes training population contains no patients under 21.
      This prediction extrapolates below the observed age range.

  - disease: heart
    condition: {field: age, greater_than: 77}
    severity: medium
    message: >
      The heart disease training population tops out near 77 years.
      Predictions above this age extrapolate beyond the observed range.

# ------------------------------------------------------------
# RISK BANDS
# Applied to the CALIBRATED probability of each disease.
# Cut points are placeholders for Review 1 and are replaced in
# Review 2 by cost-sensitive thresholds (decision curve analysis).
# ------------------------------------------------------------
risk_bands:
  - {name: "Low",      max: 0.20, color: "moss"}
  - {name: "Moderate", max: 0.45, color: "amber"}
  - {name: "High",     max: 0.70, color: "clay"}
  - {name: "Critical", max: 1.01, color: "rust"}
